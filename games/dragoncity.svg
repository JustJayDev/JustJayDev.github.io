  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="640" cy="110" r="150" fill="url(#moon)" opacity="0.55"/>
  <circle cx="640" cy="110" r="52" fill="#ffe9a8" opacity="0.9"/>
