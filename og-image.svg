<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="JustJayDev - mobile gamer with a builder's mind">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a33"/>
      <stop offset="100%" stop-color="#070b10"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a2432" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.75">
    <path d="M40 92V40h52"/>
    <path d="M1160 92V40h-52"/>
    <path d="M40 538v52h52"/>
    <path d="M1160 538v52h-52"/>
  </g>

  <!-- monogram -->
  <g>
    <rect x="80" y="150" width="120" height="120" rx="16" fill="#0d141d" stroke="#22d3ee" stroke-width="3"/>
    <text x="140" y="228" font-family="JetBrains Mono, monospace" font-weight="600" font-size="54" fill="#22d3ee" text-anchor="middle">JJ</text>
    <rect x="112" y="240" width="56" height="8" fill="#22d3ee"/>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="248" y="196" fill="#22d3ee" font-size="22" letter-spacing="6">JUSTJAYDEV</text>
  </g>
  <g font-family="Space Grotesk, sans-serif" font-weight="700">
    <text x="248" y="248" fill="#e8edf2" font-size="44">Mobile gamer</text>
    <text x="248" y="300" fill="#e8edf2" font-size="44">with a builder&#39;s mind</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="18" fill="#8b98a8" letter-spacing="2">
    <text x="80" y="380">MOBILE GAMER</text>
    <text x="80" y="416">BUILDS ON PHONE</text>
    <text x="80" y="452">FREEFIRE MAX</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <rect x="80" y="492" width="420" height="52" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="290" y="526" fill="#22d3ee" font-size="17" letter-spacing="3" text-anchor="middle">justjaydev.github.io</text>
  </g>

  <text x="1120" y="560" fill="#8b98a8" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="4" text-anchor="end">v1.0</text>
</svg>