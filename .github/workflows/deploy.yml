name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `build` runs tsc --noEmit first, so a type error fails the deploy
      # rather than shipping. This is the whole point of v7's pipeline.
      - name: Build (type-check gates the bundle)
        run: npm run build

      # Fails loudly if any real secret pattern made it into dist/.
      - name: Guard against leaked secrets in build output
        run: |
          if grep -rIlE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}' dist; then
            echo "::error::A secret pattern was found in dist/. Aborting deploy."
            exit 1
          fi
          echo "No secrets found in dist/."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
