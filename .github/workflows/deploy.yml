name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `build` runs tsc --noEmit first, so a type error fails the deploy
      # rather than shipping. That is the whole point of v7's pipeline.
      - name: Build (type-check gates the bundle)
        run: npm run build

      # Fails loudly if any real secret pattern made it into dist/.
      - name: Guard against leaked secrets in build output
        run: |
          if grep -rIlE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}' dist; then
            echo "::error::A secret pattern was found in dist/. Aborting deploy."
            exit 1
          fi
          echo "No secrets found in dist/."

      # This repo's Pages source is the gh-pages branch rather than GitHub
      # Actions, so publish there. force_orphan keeps the published root clean
      # instead of letting stale bundles accumulate across deploys.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'