<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Not found — JustJayDev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <!--
      This page is only reached for paths that do not exist. Every real route
      now ships its own index.html (see scripts/gen-static.mjs), so Pages serves
      those with HTTP 200 and never lands here. There is deliberately no
      meta-refresh and no sessionStorage redirect: bouncing a genuine 404 to the
      homepage hides the missing page from crawlers and loses the visitor's
      context. One honest 404, with a real link home.
    -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        background: #070b10;
        color: #e6edf3;
        font: 400 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 2rem;
      }
      a { color: #34d399; }
      h1 { font-size: 1.5rem; margin: 0; }
      p { margin: 0; color: #8fa3b0; }
    </style>
  </head>
  <body>
    <h1>404 — that page does not exist.</h1>
    <p>Nothing is published at this address.</p>
    <p><a href="/">Back to justjaydev.github.io</a></p>
  </body>
</html>
