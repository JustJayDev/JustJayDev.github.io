<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041219"/>
      <stop offset="0.5" stop-color="#0a2e3d"/>
      <stop offset="1" stop-color="#0a0d0f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
  </g>
  <!-- crewmate emblem -->
  <g transform="translate(400,205)">
    <ellipse rx="58" ry="62" fill="none" stroke="url(#cyan)" stroke-width="3" filter="url(#blur)" opacity="0.5"/>
    <ellipse rx="52" ry="56" fill="none" stroke="url(#cyan)" stroke-width="2.5"/>
    <!-- crewmate body -->
    <path d="M-30,-10 Q-34,-44 0,-44 Q34,-44 30,-10 L30,20 Q30,40 12,40 L-12,40 Q-30,40 -30,20 Z" fill="url(#cyan)"/>
    <!-- visor -->
    <path d="M-20,-20 Q0,-30 20,-20 Q22,-6 18,0 Q0,-8 -18,0 Q-22,-6 -20,-20 Z" fill="#0a2e3d" stroke="#cffafe" stroke-width="1.5"/>
    <!-- backpack -->
    <rect x="30" y="-6" width="14" height="34" rx="7" fill="url(#cyan)" opacity="0.7"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#fff" letter-spacing="2">
    AMONG US
  </text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#cyan)" letter-spacing="8">
    CERTIFIED IMPOSTOR
  </text>
  <rect x="300" y="412" width="200" height="4" rx="2" fill="url(#cyan)" filter="url(#soft)"/>
</svg>