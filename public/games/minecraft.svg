<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04180a"/>
      <stop offset="0.5" stop-color="#0d3a1c"/>
      <stop offset="1" stop-color="#0a0d0f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g stroke="#22c55e" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
  </g>
  <!-- blocky pickaxe / cube emblem -->
  <g transform="translate(400,200)">
    <rect x="-48" y="-48" width="96" height="96" fill="none" stroke="url(#green)" stroke-width="3" filter="url(#blur)" opacity="0.5"/>
    <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="url(#green)" stroke-width="2.5"/>
    <!-- grass block top -->
    <rect x="-30" y="-30" width="60" height="18" fill="url(#green)"/>
    <rect x="-30" y="-12" width="60" height="42" fill="#5b3a1e" opacity="0.9"/>
    <rect x="-30" y="-12" width="60" height="42" fill="none" stroke="#7c4a2a" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="-30" y1="9" x2="30" y2="9" stroke="#7c4a2a" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#7c4a2a" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900" fill="#fff" letter-spacing="2">
    MINECRAFT
  </text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#green)" letter-spacing="8">
    ENDER DRAGON x4
  </text>
  <rect x="300" y="412" width="200" height="4" rx="2" fill="url(#green)" filter="url(#soft)"/>
</svg>