<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1204"/>
      <stop offset="0.5" stop-color="#3a2c08"/>
      <stop offset="1" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
  </g>
  <!-- star emblem -->
  <g transform="translate(400,205)">
    <circle r="62" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#blur)" opacity="0.5"/>
    <circle r="56" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M0,-48 L12,-16 L46,-16 L19,2 L29,36 L0,16 L-29,36 L-19,2 L-46,-16 L-12,-16 Z" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <circle r="8" fill="url(#gold)"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" fill="#fff" letter-spacing="2">
    BRAWL STARS
  </text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#gold)" letter-spacing="8">
    17,250 TROPHIES
  </text>
  <rect x="300" y="412" width="200" height="4" rx="2" fill="url(#gold)" filter="url(#soft)"/>
</svg>