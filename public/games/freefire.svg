<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0505"/>
      <stop offset="0.5" stop-color="#3a0d0d"/>
      <stop offset="1" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff1a1a"/>
      <stop offset="0.5" stop-color="#ff6b1a"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- grid lines -->
  <g stroke="#ff4d4d" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
  </g>

  <!-- giant flame emblem -->
  <g transform="translate(400,215)">
    <path d="M0,-70 C30,-40 60,-10 50,30 C44,55 20,70 0,70 C-20,70 -44,55 -50,30 C-60,-10 -30,-40 0,-70 Z"
          fill="url(#flame)" filter="url(#blur)" opacity="0.4"/>
    <path d="M0,-55 C22,-30 42,-5 36,25 C32,44 14,55 0,55 C-14,55 -32,44 -36,25 C-42,-5 -22,-30 0,-55 Z"
          fill="url(#flame)"/>
    <path d="M0,-35 C10,-18 18,2 14,20 C12,32 6,38 0,38 C-6,38 -12,32 -14,20 C-18,2 -10,-18 0,-35 Z"
          fill="#fff" opacity="0.85"/>
  </g>

  <!-- title -->
  <text x="400" y="360" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" fill="#fff" letter-spacing="2">
    FREE FIRE
  </text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="url(#flame)" letter-spacing="10">
    MAX
  </text>

  <!-- bottom accent -->
  <rect x="300" y="412" width="200" height="4" rx="2" fill="url(#flame)" filter="url(#soft)"/>
</svg>