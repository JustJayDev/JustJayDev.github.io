<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040918"/>
      <stop offset="0.5" stop-color="#0c1f4a"/>
      <stop offset="1" stop-color="#08060f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g stroke="#3b82f6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
  </g>
  <!-- crossed swords emblem -->
  <g transform="translate(400,205)">
    <circle r="62" fill="none" stroke="url(#blue)" stroke-width="3" filter="url(#blur)" opacity="0.5"/>
    <circle r="56" fill="none" stroke="url(#blue)" stroke-width="2.5"/>
    <path d="M-40,-40 L40,40" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M40,-40 L-40,40" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-40,-40 L-52,-52 L-34,-54 Z" fill="url(#blue)"/>
    <path d="M40,-40 L52,-52 L34,-54 Z" fill="url(#blue)"/>
    <circle r="10" fill="url(#blue)"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" fill="#fff" letter-spacing="2">
    MOBILE LEGENDS
  </text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#blue)" letter-spacing="8">
    BANG BANG · MYTHIC
  </text>
  <rect x="300" y="412" width="200" height="4" rx="2" fill="url(#blue)" filter="url(#soft)"/>
</svg>