<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041018"/>
      <stop offset="0.5" stop-color="#0a2438"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="cyangrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- pitch lines -->
  <g stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337" x2="800" y2="337"/>
  </g>
  <!-- football emblem -->
  <g transform="translate(400,205)">
    <circle r="64" fill="none" stroke="url(#cyangrad)" stroke-width="3" filter="url(#blur)" opacity="0.5"/>
    <circle r="58" fill="none" stroke="url(#cyangrad)" stroke-width="2.5"/>
    <path d="M0,-58 L18,-40 L18,40 L0,58 L-18,40 L-18,-40 Z" fill="none" stroke="url(#cyangrad)" stroke-width="2" opacity="0.9"/>
    <circle r="16" fill="url(#cyangrad)"/>
  </g>
  <!-- title -->
  <text x="400" y="360" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="56" font-weight="900" fill="#fff" letter-spacing="2">
    FC MOBILE
  </text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#cyangrad)" letter-spacing="8">
    EA SPORTS FC
  </text>
  <!-- bottom accent -->
  <rect x="300" y="412" width="200" height="4" rx="2" fill="url(#cyangrad)" filter="url(#soft)"/>
</svg>
