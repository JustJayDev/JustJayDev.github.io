<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Not found — JustJayDev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="canonical" href="https://justjaydev.github.io/" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        background: #070b10;
        color: #e6edf3;
        font: 400 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 2rem;
      }
      a { color: #34d399; }
      h1 { font-size: 1.5rem; margin: 0; }
      p { margin: 0; color: #8b98a5; }
    </style>
  </head>
  <body>
    <h1>404 — that page does not exist.</h1>
    <p>Taking you back to the homepage.</p>
    <p><a href="/">justjaydev.github.io</a></p>
    <script>
      // Preserve the requested path so the SPA can show its own NotFound view
      // after the redirect, rather than silently landing on Home.
      try {
        sessionStorage.setItem('jj-spa-path', location.pathname + location.search + location.hash);
      } catch (e) {}
    </script>
  </body>
</html>
