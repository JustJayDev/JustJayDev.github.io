<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>JustJayDev — Jay Kumar</title>
    <script>
      // SPA fallback for GitHub Pages: forward the real path as ?p=... query.
      // The MAIN site lives at the domain root, so we keep 0 path segments
      // (i.e. always forward to "/?p=<original path>").
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' +
        l.pathname.replace(/^\//, '').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body><p>Redirecting…</p></body>
</html>
