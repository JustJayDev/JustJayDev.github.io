<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b10" />
    <meta name="robots" content="noindex, follow" />
    <title>Offline - JustJayDev</title>
    <link rel="icon" type="image/svg+xml" href="/jj-mark.svg" />
    <style>
      html, body { margin: 0; background: #070b10; color: #e8edf2; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .wrap { max-width: 420px; width: 100%; border: 1px solid #1a2432; background: #0d141d; padding: 28px 24px; }
      .label { color: #22d3ee; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 12px; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { color: #8b98a8; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid #22d3ee;
        color: #22d3ee;
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="label">// no connection</p>
      <h1>You are offline</h1>
      <p>
        This page needs a connection the first time it opens. Pages you have already
        visited will still work offline.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
