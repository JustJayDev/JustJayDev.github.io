<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustJayDev — Under Development</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0D12;
      color: #F4F6FA;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7C6CF0, #2DD4BF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(124, 108, 240, 0.35);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      background: rgba(124, 108, 240, 0.15);
      color: #7C6CF0;
      border: 1px solid rgba(124, 108, 240, 0.3);
      border-radius: 99px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    p {
      color: #9AA3B2;
      font-size: 15px;
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 36px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, #7C6CF0, #2DD4BF);
      border-radius: 99px;
      margin: 0 auto 36px;
    }

    .made-by {
      color: #5C6472;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .made-by span {
      color: #7C6CF0;
      font-weight: 600;
    }

    .instagram-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #7C6CF0, #2DD4BF);
      color: #fff;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(124, 108, 240, 0.4);
    }

    .instagram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124, 108, 240, 0.5);
    }

    .instagram-btn:active {
      transform: scale(0.97);
    }

    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 48px;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5C6472;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 24px; }
      p { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="logo">JJ</div>

  <div class="badge">🚀 Coming Soon</div>

  <h1>JustJayDev</h1>

  <p>Something awesome is in the works. This site is currently under development. Stay tuned!</p>

  <div class="divider"></div>

  <p class="made-by">Made with ❤️ by <span>Jay Kumar</span></p>

  <a class="instagram-btn" href="https://www.instagram.com/jaykumar152010?igsi=MXF6eWd2bWg3am1rMA==" target="_blank" rel="noopener">
  Follow on Instagram
  </a>

  <div class="dots">
    <span></span>
    <span></span>
    <span></span>
  </div>

</body>
</html>
