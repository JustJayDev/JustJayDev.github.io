    <title>JustJayDev - Jay Kumar</title>
    <style>
      html { background: #020617; }
      #boot-ring { position: fixed; top: 50%; left: 50%; margin: -16px; width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(99,102,241,.25); border-top-color: #6366f1; animation: bootspin .7s linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jjdev-theme');
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = (stored === 'light' || stored === 'dark') ? stored : (sys ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <script>
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
    <div id="root"><div id="boot-ring"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
