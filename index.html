<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <meta name="color-scheme" content="dark light" />

    <title>JustJayDev — The definition of victory.</title>
    <meta
      name="description"
      content="Jay Kumar — mobile gamer, AI builder and future trader. Free Fire Max Grandmaster, Dragon City collector, and the developer behind TitleForge and PixVault."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JustJayDev" />
    <meta property="og:title" content="JustJayDev — The definition of victory." />
    <meta property="og:image" content="https://justjaydev.github.io/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect, then load with swap so text never waits on them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('jj-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        JustJayDev — mobile gamer, AI builder, future trader. This site needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
